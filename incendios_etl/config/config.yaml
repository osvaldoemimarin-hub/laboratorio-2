# Configuración del pipeline de incendios forestales (NASA FIRMS / Earthdata)

fuente:
  # Producto VIIRS del satélite NOAA-20 en tiempo casi real (resolución 375 m)
  sensor_api: VIIRS_NOAA20_NRT
  # Feed público (no requiere clave): últimos 7 días, Sudamérica
  url_publica: https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-20-viirs-c2/csv/J1_VIIRS_C2_South_America_7d.csv
  # API de área (requiere FIRMS_MAP_KEY): {key}/{sensor}/{bbox}/{dias}
  url_api: https://firms.modaps.eosdis.nasa.gov/api/area/csv/{key}/{sensor}/{bbox}/{dias}
  # Caja de Sudamérica: oeste,sur,este,norte
  bbox: "-82,-56,-34,13"
  dias: 5            # la API permite de 1 a 5 días por consulta
  timeout_s: 120

fuente_excel:
  # Segunda fuente: área de bosque por país (km²), Banco Mundial, indicador AG.LND.FRST.K2
  indicador: AG.LND.FRST.K2
  url: https://api.worldbank.org/v2/en/indicator/AG.LND.FRST.K2?downloadformat=excel
  # Copia de respaldo incluida en el repositorio (se usa si no hay internet)
  archivo_respaldo: data/referencia/API_AG.LND.FRST.K2_bosque_banco_mundial.xls
  hoja: Data
  filas_encabezado: 3
  timeout_s: 120

limites_paises:
  # Natural Earth 1:50m (dominio público). Sirve para asignar el país de cada detección.
  archivo: data/referencia/ne_50m_admin_0_countries.geojson
  campo_iso3: ISO_A3_EH
  campo_nombre: NAME_ES

paises_sudamerica: [ARG, BOL, BRA, CHL, COL, ECU, GUY, PRY, PER, SUR, URY, VEN]

region_interes:
  nombre: Colombia
  iso3: COL

calidad:
  min_filas_bronze: 100
  columnas_requeridas:
    - latitude
    - longitude
    - bright_ti4
    - scan
    - track
    - acq_date
    - acq_time
    - satellite
    - confidence
    - bright_ti5
    - frp
    - daynight

modelo:
  objetivo: confianza
  semilla: 42
  test_size: 0.2
  cv_folds: 3
  # Si el modelo complejo no supera al baseline por al menos este margen de F1 macro,
  # se recomienda el baseline (regla "preferir el modelo más simple" del Lab 1).
  margen_minimo_f1: 0.01
